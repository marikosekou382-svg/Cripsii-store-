
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIPSII STORE - Administration</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#111;color:white;
 font-family:Arial,sans-serif;padding:20px;
}
header{
 background:#222;padding:22px;border-radius:14px;
 border-bottom:3px solid #d4af37;
}
h1{color:#d4af37;margin:0}
h2{color:#d4af37}
nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
button{
 background:#d4af37;color:#111;border:0;
 padding:13px 18px;border-radius:8px;
 font-weight:bold;cursor:pointer;
}
section{
 background:#222;padding:20px;
 border-radius:12px;margin-bottom:20px;
}
input,select,textarea{
 width:100%;padding:13px;margin:8px 0;
 border-radius:7px;border:0;
}
.product{
 background:#333;padding:14px;
 margin:10px 0;border-radius:8px;
}
.product img{width:90px;border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h1>CRIPSII STORE</h1>
<p>ESPACE ADMINISTRATEUR</p>
</header>

<nav>
<button onclick="show('add')">Ajouter produit</button>
<button onclick="show('products')">Mes produits</button>
<button onclick="logout()">Déconnexion</button>
</nav>

<section id="add">
<h2>Ajouter un produit</h2>

<input id="name" placeholder="Nom du produit">

<input id="price" type="number" placeholder="Prix en FCFA">

<select id="category">
<option>Vêtements</option>
<option>Chaussures</option>
<option>Sacs</option>
<option>Accessoires</option>
<option>Montres</option>
<option>Lunettes</option>
<option>Autres</option>
</select>

<textarea id="description"
placeholder="Description du produit"></textarea>

<input id="image" placeholder="URL de la photo du produit">

<input id="stock" type="number" placeholder="Quantité en stock">

<button onclick="addProduct()">ENREGISTRER</button>
</section>

<section id="products">
<h2>Mes produits</h2>
<div id="productList">Chargement...</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "TON_URL_SUPABASE";
const SUPABASE_KEY = "TA_CLE_PUBLIQUE_SUPABASE";

const db = window.supabase.createClient(
 SUPABASE_URL,SUPABASE_KEY
);

async function checkLogin(){
 const {data,error}=await db.auth.getSession();
 if(error || !data.session){
  window.location.href="admin.html";
 }
}

function show(id){
 document.getElementById(id).scrollIntoView({
  behavior:"smooth"
 });
}

async function addProduct(){
 const name=document.getElementById("name").value.trim();
 const price=Number(document.getElementById("price").value);
 const category=document.getElementById("category").value;
 const description=document.getElementById("description").value;
 const image_url=document.getElementById("image").value.trim();
 const stock=Number(document.getElementById("stock").value);

 if(!name || price<=0){
  alert("Entre un nom et un prix valide.");
  return;
 }

 const {error}=await db.from("products").insert([{
  name,price,category,description,image_url,stock
 }]);

 if(error){
  alert("Erreur : "+error.message);
  return;
 }

 alert("Produit ajouté !");
 document.getElementById("name").value="";
 document.getElementById("price").value="";
 document.getElementById("description").value="";
 document.getElementById("image").value="";
 document.getElementById("stock").value="";
 loadProducts();
}

async function loadProducts(){
 const {data,error}=await db.from("products")
  .select("*").order("id",{ascending:false});

 const list=document.getElementById("productList");

 if(error){
  list.textContent="Erreur : "+error.message;
  return;
 }

 list.innerHTML="";

 data.forEach(p=>{
  const item=document.createElement("div");
  item.className="product";

  const title=document.createElement("h3");
  title.textContent=p.name;

  const price=document.createElement("p");
  price.textContent=Number(p.price).toLocaleString("fr-FR")+" FCFA";

  const category=document.createElement("p");
  category.textContent=p.category;

  const stock=document.createElement("p");
  stock.textContent="Stock : "+p.stock;

  item.append(title,price,category,stock);

  if(p.image_url){
   const img=document.createElement("img");
   img.src=p.image_url;
   img.alt=p.name;
   item.append(img);
  }

  list.append(item);
 });
}

async function logout(){
 await db.auth.signOut();
 window.location.href="admin.html";
}

checkLogin().then(loadProducts);
</script>
</body>
</html>
